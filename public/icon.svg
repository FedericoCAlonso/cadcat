<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#080C14"/>
    </radialGradient>
    <radialGradient id="floorGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorShadow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Facet Gradients -->
    <!-- Left Pillar Outer Face -->
    <linearGradient id="p1_leftOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Left Pillar Top Bevel -->
    <linearGradient id="p1_leftTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>

    <!-- Left Valley Incline (going down to center V) -->
    <linearGradient id="p1_leftValley" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Right Valley Incline (going up from center V) -->
    <linearGradient id="p1_rightValley" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Right Pillar Top Bevel -->
    <linearGradient id="p1_rightTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Right Pillar Outer Face -->
    <linearGradient id="p1_rightOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg1)"/>
  <ellipse cx="256" cy="380" rx="145" ry="34" fill="url(#floorGlow1)"/>
  <ellipse cx="256" cy="383" rx="115" ry="18" fill="url(#floorShadow1)"/>

  <!-- Slender faceted M: x span [146..366] (width 220), y span [148..364] (height 216) -->
  <g id="origami_gold">
    <!-- Left Column: Front/Outer face -->
    <polygon points="146,180 188,148 188,348 146,364" fill="url(#p1_leftOuter)"/>
    
    <!-- Left Top Bevel/Fold -->
    <polygon points="146,180 188,148 226,176 184,208" fill="url(#p1_leftTop)"/>

    <!-- Left Diagonal / Inner Slope -->
    <polygon points="184,208 226,176 256,290 232,312" fill="url(#p1_leftValley)"/>

    <!-- Right Diagonal / Inner Slope -->
    <polygon points="256,290 280,312 328,208 286,176" fill="url(#p1_rightValley)"/>

    <!-- Right Top Bevel/Fold -->
    <polygon points="286,176 328,208 366,180 324,148" fill="url(#p1_rightTop)"/>

    <!-- Right Column: Front/Outer face -->
    <polygon points="324,148 366,180 366,364 324,348" fill="url(#p1_rightOuter)"/>

    <!-- Central Vertex Facet -->
    <polygon points="232,312 256,290 280,312 256,326" fill="#78350F"/>
  </g>
</svg>